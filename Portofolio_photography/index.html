<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Portofolio Fotografi</title>

    <!-- Font dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-page.css">
    

</head>

            <div class="gallery-item" data-category="kendaraan">
                <img src="car/DSCN3267.jpg" alt="Foto Mobil 5">
            </div>

            <div class="gallery-item" data-category="kendaraan best">
                <img src="car/DSCN3345.jpg" alt="Foto Mobil 6">

            <div class="gallery-item" data-category="kendaraan">
                <img src="car/DSCN3362.jpg" alt="Foto Mobil 7">

            <div class="gallery-item" data-category="kendaraan">
                <img src="car/DSCN3364.jpg" alt="Foto Mobil 8">
            </div>

            <div class="gallery-item" data-category="kendaraan">
                <img src="car/DSCN3415.jpg" alt="Foto Mobil 9">
            </div>

            <div class="gallery-item" data-category="kendaraan">
                <img src="car/DSCN3417.jpg" alt="Foto Mobil 10">

                <img src="car/DSCN3542.jpg" alt="Foto Mobil 11">

        </div>
    </main>

    <!-- Lightbox Pop-up -->
    <div id="lightbox" class="lightbox">
        <button class="close-btn">&times;</button>
        <img id="lightbox-img" src="" alt="Fullscreen Image">
    </div>

    <!-- JAVASCRIPT MURNI (Vanilla JS) -->
<script>
    // === LOGIKA FILTER GALERI ===
    const filterButtons = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');

    filterButtons.forEach(button => {
        button.addEventListener('click', () => {
            // 1. Ubah warna tombol yang aktif
            filterButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // 2. Ambil nilai kategori dari tombol yang diklik
            const filterValue = button.getAttribute('data-filter').toLowerCase();

            // 3. Cocokkan dengan label foto (Menggunakan classList.contains atau string .includes)
            galleryItems.forEach(item => {
                // Ambil label dari item (misal: "kendaraan best")
                const itemCategory = item.getAttribute('data-category').toLowerCase();
                
                // PENTING: Gunakan .includes() agar bisa menemukan kata 'best' di antara kata lain
                if (filterValue === 'semua' || itemCategory.includes(filterValue)) {
                    item.style.display = 'inline-block'; 
                } else {
                    item.style.display = 'none'; 
                }
            });
        });
    });

    // === LOGIKA LIGHTBOX (TIDAK DIUBAH) ===
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close-btn');

    galleryItems.forEach(item => {
        item.addEventListener('click', () => {
            const imgElement = item.querySelector('img');
            let imageSrc = imgElement.src;
            imageSrc = imageSrc.replace('&w=800', '&w=1600'); 
            lightboxImg.src = imageSrc;
            lightbox.classList.add('show');
            document.body.style.overflow = 'hidden'; 
        });
    });

    const closeLightbox = () => {
        lightbox.classList.remove('show');
        document.body.style.overflow = 'auto'; 
        setTimeout(() => {
            lightboxImg.src = '';
        }, 300);
    };

    closeBtn.addEventListener('click', closeLightbox);
    lightboxImg.addEventListener('click', closeLightbox);
    
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            closeLightbox();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('show')) {
            closeLightbox();
        }
    });
</script>
</body>
</html>
